name: Integration

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
        working-directory: client

      - run: npm run lint
        working-directory: client

      - run: npm run build
        working-directory: client

  server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
        working-directory: server

      - run: npm run lint
        working-directory: server

      - run: npm run test
        working-directory: server
